<style>
        /* Custom hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
        .segment-active {
            transform: translateX(0%);
        }
        .segment-inactive {
            transform: translateX(100%);
        }
    </style>

<body class="bg-bg-base text-on-surface font-body-reg antialiased h-full flex flex-col overflow-hidden selection:bg-surface-variant selection:text-primary">
<!-- Top Area: Brand (35%) -->
<div class="h-[35%] flex flex-col items-center justify-center p-margin-page relative">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-low/20 via-bg-base to-bg-base pointer-events-none"></div>
<div class="flex flex-col items-center gap-4 z-10">
<!-- Minimal Brand Mark -->
<div class="w-16 h-16 rounded-full border border-border-subtle flex items-center justify-center relative shadow-[0_0_40px_rgba(255,255,255,0.05)]">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                    fingerprint
                </span>
<div class="absolute inset-0 rounded-full border border-primary/20 scale-110"></div>
</div>
<!-- Title -->
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
                TAP_CORE
            </h1>
</div>
</div>
<!-- Bottom Sheet: Auth Modal (65%) -->
<div class="h-[65%] w-full bg-background border-t border-border-subtle rounded-t-4xl flex flex-col p-margin-page shadow-[0_-8px_40px_rgba(0,0,0,0.8)] relative z-20">
<!-- Drag Handle Indicator -->
<div class="w-12 h-1 bg-border-strong rounded-full mx-auto mb-6"></div>
<!-- Segment Switch -->
<div class="bg-surface-subtle p-1 rounded-full flex relative mb-8">
<div class="absolute inset-y-1 left-1 right-1 w-[calc(50%-0.25rem)] bg-surface-container-high rounded-full shadow-sm transition-transform duration-300 ease-in-out" id="segment-indicator"></div>
<button class="flex-1 py-2.5 rounded-full z-10 font-body-sm text-body-sm text-primary transition-colors text-center" onclick="toggleSegment(0)">
                Sign In
            </button>
<button class="flex-1 py-2.5 rounded-full z-10 font-body-sm text-body-sm text-text-muted transition-colors text-center" onclick="toggleSegment(1)">
                Register
            </button>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted group-focus-within:text-primary transition-colors text-[20px]">
                    mail
                </span>
<input class="w-full bg-surface-subtle border border-transparent rounded-2xl py-4 pl-12 pr-4 text-primary font-body-reg text-body-reg placeholder:text-text-muted focus:border-border-strong focus:ring-0 transition-all outline-none" placeholder="Email Address" type="email"/>
</div>
<!-- Password Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted group-focus-within:text-primary transition-colors text-[20px]">
                    lock
                </span>
<input class="w-full bg-surface-subtle border border-transparent rounded-2xl py-4 pl-12 pr-12 text-primary font-body-reg text-body-reg placeholder:text-text-muted focus:border-border-strong focus:ring-0 transition-all outline-none" placeholder="Password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-bg-base font-headline-md text-headline-md rounded-2xl py-4 mt-2 active:scale-[0.96] transition-transform duration-200 flex items-center justify-center gap-2" type="submit">
                Continue
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Social Auth -->
<div class="mt-auto pt-6 flex flex-col gap-3">
<div class="flex items-center gap-4 mb-2">
<div class="flex-1 h-px bg-border-subtle"></div>
<span class="font-body-sm text-body-sm text-text-muted uppercase tracking-widest">Or connect with</span>
<div class="flex-1 h-px bg-border-subtle"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="border border-border-subtle bg-surface-dim hover:bg-surface-variant rounded-2xl py-3 flex items-center justify-center gap-2 transition-colors active:scale-95">
<svg class="w-5 h-5 text-primary fill-current" viewbox="0 0 24 24">

</svg>
</button>
<button class="border border-border-subtle bg-surface-dim hover:bg-surface-variant rounded-2xl py-3 flex items-center justify-center gap-2 transition-colors active:scale-95">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
</div>
</div>
</div>
<script>
        function toggleSegment(index) {
            const indicator = document.getElementById('segment-indicator');
            const buttons = indicator.parentElement.querySelectorAll('button');
            
            if(index === 0) {
                indicator.style.transform = 'translateX(0)';
                buttons[0].classList.replace('text-text-muted', 'text-primary');
                buttons[1].classList.replace('text-primary', 'text-text-muted');
            } else {
                indicator.style.transform = 'translateX(100%)';
                buttons[1].classList.replace('text-text-muted', 'text-primary');
                buttons[0].classList.replace('text-primary', 'text-text-muted');
            }
        }
    </script>
</body></html>
