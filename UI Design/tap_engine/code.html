<script>
        // Simple Interaction Logic for the Tap Engine
        document.addEventListener('DOMContentLoaded', () => {
            const tapButton = document.getElementById('tapEngine');
            const scoreDisplay = document.getElementById('scoreDisplay');
            let currentScore = 1428950;

            // Format number with commas
            const formatNumber = (num) => {
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            };

            // Haptic/Visual Feedback Handler
            const handleTap = (e) => {
                // Prevent default behavior to avoid double-firing on mobile
                e.preventDefault();
                
                // Increment score
                currentScore += 1;
                scoreDisplay.textContent = formatNumber(currentScore);

                // Optional: Create floating '+1' text effect (Vanilla JS)
                const rect = tapButton.getBoundingClientRect();
                const x = e.clientX || (e.touches && e.touches[0].clientX) || rect.left + rect.width / 2;
                const y = e.clientY || (e.touches && e.touches[0].clientY) || rect.top + rect.height / 2;

                const floater = document.createElement('div');
                floater.textContent = '+1';
                floater.className = 'absolute text-primary font-bold text-xl select-none pointer-events-none z-50';
                
                // Ensure the container is positioned relative for absolute children if appending to body
                document.body.appendChild(floater);
                
                // Center the floater on tap position
                floater.style.left = `${x - 10}px`;
                floater.style.top = `${y - 10}px`;

                // Animate the floater
                let start = null;
                const duration = 800; // ms

                const step = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = timestamp - start;
                    const percent = Math.min(progress / duration, 1);
                    
                    // Ease out
                    const easeOutQuart = 1 - Math.pow(1 - percent, 4);
                    
                    floater.style.transform = `translateY(-${easeOutQuart * 60}px) scale(${1 - (percent * 0.5)})`;
                    floater.style.opacity = 1 - percent;

                    if (progress < duration) {
                        window.requestAnimationFrame(step);
                    } else {
                        floater.remove();
                    }
                };

                window.requestAnimationFrame(step);
            };

            // Bind events (handling both mouse and touch carefully)
            tapButton.addEventListener('pointerdown', handleTap);
        });
    </script>
